stats:
  imports:
    fixed: 14

# The four paths no single length limit covers, argued in docs/testing.md.
filecheck:
  max-lines: 400
  allow:
    - path: "**/*_test.go"
      max-lines: 1000
    - path: parser/*.go
      max-lines: 1500
    - path: flatstack/engine/*.go
      max-lines: 1400
    - path: model/ast.go
      max-lines: 500
