stats:
  imports:
    fixed: 14

# Four paths take a higher limit; docs/testing.md argues each.
filecheck:
  max-lines: 400
  allow:
    - path: "**/*_test.go"
      max-lines: 1000
    - path: parser/*.go
      max-lines: 1500
    - path: flatstack/engine/*.go
      max-lines: 1400
    - path: model/ast.go
      max-lines: 500
