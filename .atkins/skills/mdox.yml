name: Markdown formatting and linting
help: >-
  Writes every markdown file of the tree in one format with splint, and lints
  the language with vale. mdox:fmt rewrites the files in place; mdox:lint
  reports the language.

  The name stays mdox for the repositories that call it. The formatter is
  splint, which reproduces mdox's output and holds the prose linter beside it.

when:
  files:
    - .vale.ini
    - docs/
    - README.md

# docs/pipeline.md argues the missing formatting check and the vale gate.
tasks:
  default:
    desc: "Check the markdown formatting and language"
    cmds:
      - task: lint

  fmt:
    desc: "Write every markdown file of the tree in one format"
    passthru: true
    cmds:
      - splint fix --markdown ./...

  lint:
    desc: "Run vale to lint language"
    passthru: true
    cmds:
      - if: $(test -f scripts/vale-gate.sh)
        cmd: ./scripts/vale-gate.sh
      - if: $(test -f .vale.ini && ! test -f scripts/vale-gate.sh)
        cmd: docker run --rm -v $PWD:/src -w /src jdkato/vale --output=line .

  prose:
    desc: "Report the constructions this tree leans on that the standard library does not"
    passthru: true
    cmds:
      - splint --linters=prose --stats ./...

  setup:
    desc: "Install splint, which formats the markdown and reports the prose"
    interactive: true
    cmds:
      - go install github.com/titpetric/tools/splint@latest
