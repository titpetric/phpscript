<VirtualHost *:${VANILLA_PORT}>
	DocumentRoot /var/www/html/public

	<Directory /var/www/html/public>
		Require all granted
		# The front controller: a path that is not a file on disk reaches
		# index.php, which is where Slim's router takes over. Written here and
		# not in an .htaccess, so apache reads it once at startup instead of
		# stat'ing a directory chain on every request.
		RewriteEngine On
		RewriteCond %{REQUEST_FILENAME} !-f
		RewriteCond %{REQUEST_FILENAME} !-d
		RewriteRule ^ index.php [QSA,L]
	</Directory>

	# No access log. One line per request through a pipe is work the phpscript
	# side is not doing, and a load sweep writes millions of them.
	ErrorLog /proc/self/fd/2

	# One connection for the whole segment. The image's default closes it after
	# 100 requests, and a generator holding one connection open then pays a
	# handshake per hundred, which the other sides never pay: net/http and fpm
	# both keep a connection for as long as the client holds it.
	KeepAlive On
	MaxKeepAliveRequests 0
	KeepAliveTimeout 65
</VirtualHost>
