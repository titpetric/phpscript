# A fixed set of workers, which is the arrangement the phpscript side runs in:
# TESTSERVER_WORKERS requests answered at once and the rest waiting. The spare
# bounds equal the start count, so apache forks them all at startup and never
# reaps one mid-sweep.
#
# MaxConnectionsPerChild 0, so no child is recycled part-way through a segment.
# A recycle costs the next request a fork and a cold opcache lookup, and that
# belongs in a measurement of apache's lifecycle, not of a handler.
<IfModule mpm_prefork_module>
	StartServers			${VANILLA_WORKERS}
	MinSpareServers			${VANILLA_WORKERS}
	MaxSpareServers			${VANILLA_WORKERS}
	MaxRequestWorkers		${VANILLA_WORKERS}
	MaxConnectionsPerChild	0
</IfModule>
