; opcache as a served application runs it. Without this every request
; recompiles public/index.php and all eleven of Slim's files, which measures
; the compiler and not the request path.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
; The files do not change while the server is up, so nothing has to be stat'd
; for a timestamp on every request.
opcache.validate_timestamps=0
