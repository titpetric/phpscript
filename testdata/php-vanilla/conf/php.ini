; expose_php off, so no X-Powered-By header goes out. It is what a served
; application sets, and here it also keeps the reply bytes next to the
; phpscript side's, which sends no such header.
expose_php=Off

; The errors a handler raises belong in apache's error log, which is what
; `docker compose logs` shows and what the sweep's abort check greps. Nothing
; is displayed, because a response here is a document and not a page.
display_errors=Off
log_errors=On
error_log=/proc/self/fd/2
