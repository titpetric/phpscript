; php-fpm's pool, sized the way conf/apache/mpm.conf sizes apache's children:
; a fixed set of workers forked at startup, which is the arrangement the
; phpscript side runs in with TESTSERVER_WORKERS.
;
; pm = static, so the count is the count and nothing is forked or reaped
; part-way through a segment. A fork mid-sweep costs the next request a cold
; opcache lookup and belongs in a measurement of fpm's lifecycle, not of a
; handler.
[www]
user = www-data
group = www-data

; Loopback and no unix socket, because nginx is a second container sharing the
; host's network namespace and not a filesystem.
listen = 127.0.0.1:9000

pm = static
pm.max_children = ${VANILLA_WORKERS}
pm.max_requests = 0

; The log fpm writes goes where the container's does, so `docker compose logs`
; shows it and the sweep's abort check can grep it.
access.log = /dev/null
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
catch_workers_output = yes
decorate_workers_output = no

; clear_env off, so VANILLA_PORT and VANILLA_WORKERS reach the script: fpm
; wipes the environment for a worker by default and config() reads both.
clear_env = no
