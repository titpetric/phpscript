name: Feature gap
description: An unimplemented function, class or language behaviour, or a concern the runtime does not handle yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        A gap is something PHP has and this runtime does not, or a concern no
        current API covers. Check docs/design.md first: a row in the "Won't
        build" table is a decision. Read what modern PHP does before
        proposing the classic API. PHP deprecates and supersedes functions;
        the binding worth having may name something else. The implementation
        lands with a .phpt fixture; write the expected section from what php
        prints, not from what the new code prints.
  - type: textarea
    id: missing
    attributes:
      label: What is missing
      description: The function, class or behaviour, and what breaks or gets awkward without it. Name the demo or application code that works around it today.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Current alternative
      description: How code copes today (shim, SQL, Go-side binding), and what that costs.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Change proposal
      description: The API to add, with signatures. When PHP deprecates its own API or shapes it poorly, say what to bind and why.
    validations:
      required: true
  - type: textarea
    id: prior-art
    attributes:
      label: Prior art
      description: What modern PHP does, what PHP deprecates, what other runtimes chose. Name the alternatives you discarded and why.
    validations:
      required: false
  - type: textarea
    id: test
    attributes:
      label: Acceptance (.phpt)
      description: The fixture that defines done. It fails today because the API is absent.
      render: text
    validations:
      required: false
