# Resolves the address of the compose service `phpscript` and runs venom there.
vars:
  compose: ../../../compose.yml
  address: "{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}"
  url: awk '{ print "http://" $1 ":8080" }'
  cover: ../../../cover

tasks:
  default:
    aliases: [test]
    desc: "Run the venom suite against the compose dbadmin service"
    passthru: true
    cmds:
      - task: restart
      - task: host
      - >
        docker compose -f ${{ compose }} ps -q phpscript
        | xargs --no-run-if-empty docker inspect -f '${{ address }}'
        | ${{ url }}
        | xargs --no-run-if-empty -I {} venom run venom.yml --var=host={}
      - task: cover

  cover:
    desc: "Read the coverage the venom suite produced off the running service"
    cmds:
      - mkdir -p ${{ cover }}
      - >
        docker compose -f ${{ compose }} ps -q phpscript
        | xargs --no-run-if-empty docker inspect -f '${{ address }}'
        | ${{ url }}
        | xargs --no-run-if-empty -I {} curl -fsS "{}/debug/phpscript/coverage"
        > ${{ cover }}/dbadmin.cov
      - >
        docker compose -f ${{ compose }} ps -q phpscript
        | xargs --no-run-if-empty docker inspect -f '${{ address }}'
        | ${{ url }}
        | xargs --no-run-if-empty -I {} curl -fsS "{}/debug/phpscript/coverage?mode=file"
        > ${{ cover }}/dbadmin.file.txt

  restart:
    desc: "Reload the service to read the edited PHP sources"
    cmds:
      - docker compose -f ${{ compose }} restart phpscript
      - docker compose -f ${{ compose }} exec phpscript true

  host:
    desc: "Print the address of the dbadmin container the suite runs against"
    cmds:
      - >
        docker compose -f ${{ compose }} ps -q phpscript
        | xargs --no-run-if-empty docker inspect -f '${{ address }}'
        | ${{ url }}
        | grep . || { echo "dbadmin container is not running; run 'atkins up' in the repository root" >&2; exit 1; }
