name: dbadmin

# Every route reported by `phpscript list ./...` is exercised here. Run it with
# `atkins test` from this directory: that reloads the compose service, resolves
# the container address and passes it in as {{.host}}.
#
# Every step is an `exec` running curl rather than an `http` step, and that is
# the login's doing. venom's http executor follows redirects and cannot be told
# not to, so the 302 that carries the session cookie is a response gone by the
# time it reports; and `extracts` does not publish a variable a later step or
# testcase can read in this build, so there is nowhere to put the session id
# even once it is captured. curl's cookie jar solves both: .venom-jar carries
# the session the way a browser would, and it is a file on disk that survives
# from one step to the next.
#
# Each step prints the response and then a STATUS line, so a step asserts on
# the status and the body together. A step that wants to see a redirect asks
# for headers and does not follow; a step that wants the page the redirect
# leads to follows with -L and does not ask for headers.
#
# The sign-in and sign-out posts carry a csrf field that must agree with the
# csrf cookie. The pair is double-submit: the server stores nothing, so any
# client that controls its own cookies satisfies the check by sending the same
# value in both halves, and most steps here do exactly that with a fixed
# token. What the check refuses is a cross-site form post, where the attacker
# writes neither half. The sign-in and sign-out cases take the long way - read
# the form, extract the token the page rendered, post it back - because those
# two prove the rendered forms carry a working token.
#
# The suite is idempotent. It removes its own leftovers before it starts - the
# scratch tables and the user it appends to the password file - and does its
# row editing in a scratch table, so the seeded catalogue rows keep the ids the
# migration gave them.

vars:
  host: http://dbadmin.localhost
  password: hunter2hunter2
  # How to make the service re-read its tree, which the reload case needs: a
  # SIGHUP re-runs the @startup jobs, and users.php is what rebuilds the user
  # table from the password file. The default is the compose service, and
  # `--var=reload=...` is how a run against a locally started server
  # (`phpscript server .` in the directory above) points it at that process.
  reload: docker compose -f ../../../compose.yml kill -s HUP phpscript
  # bcrypt at cost 4 of "venomvenom", which is what the reload case appends to
  # the password file:
  #   php -r 'echo password_hash("venomvenom", PASSWORD_BCRYPT, ["cost" => 4]);'
  # The cost is the lowest bcrypt accepts, because this one is written on every
  # run and the derivation is the suite's own latency.
  venom_hash: '$2y$04$OMlazGvq2PggDEJvSPMJS.iyGlOXHj82.NAwsrbcV/2y9mdorrqCO'

testcases:
  - name: remove leftovers from an earlier run
    steps:
      # The password file is the one piece of state outside the database, and
      # the reload case at the end of the suite appends to it. A run that died
      # between the two left the line behind.
      - type: exec
        script: |
          rm -f .venom-jar .venom-csrf .venom-other
          grep -v '^venom:' ../.htpasswd > .venom-htpasswd
          cp .venom-htpasswd ../.htpasswd
          rm -f .venom-htpasswd
          {{.reload}}
          sleep 1
        assertions:
          - result.code ShouldEqual 0

  - name: every page is behind the login
    steps:
      - type: exec
        script: curl -sS -i -w '\nSTATUS %{http_code}\n' {{.host}}/
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 302
          - 'result.systemout ShouldContainSubstring Location: /login'
      # A mutating route is no more reachable than a page: the gate is in the
      # bootstrap every controller includes.
      - type: exec
        script: curl -sS -i --data-urlencode "query=DROP TABLE catalogue" -w '\nSTATUS %{http_code}\n' {{.host}}/sql
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 302
          - 'result.systemout ShouldContainSubstring Location: /login'
      - type: exec
        script: curl -sS -w '\nSTATUS %{http_code}\n' {{.host}}/login
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring Sign in
          - result.systemout ShouldContainSubstring .htpasswd
      # The sign-in page is not signed in, so it carries no account strip.
      - type: exec
        script: curl -sS {{.host}}/login
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldNotContainSubstring Sign out

  - name: a mistyped password is refused, and says nothing about the account
    steps:
      - type: exec
        script: curl -sS -b "csrf=venomtoken" -d "csrf=venomtoken&username=admin&password=wrong-password" -w '\nSTATUS %{http_code}\n' {{.host}}/login
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring Those credentials were not accepted
      # The same answer for a name no line of the file carries, so the response
      # does not say which accounts are real.
      - type: exec
        script: curl -sS -b "csrf=venomtoken" -d "csrf=venomtoken&username=nobody&password=wrong-password" -w '\nSTATUS %{http_code}\n' {{.host}}/login
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring Those credentials were not accepted
      # The username is compared as written: the file carries lowercase names
      # and the primary key is computed from them.
      - type: exec
        script: curl -sS -b "csrf=venomtoken" -d "csrf=venomtoken&username=Admin&password={{.password}}" -w '\nSTATUS %{http_code}\n' {{.host}}/login
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring Those credentials were not accepted
      # A refused login leaves no session behind.
      - type: exec
        script: curl -sS -i -w '\nSTATUS %{http_code}\n' {{.host}}/
        assertions:
          - result.systemout ShouldContainSubstring STATUS 302
          - 'result.systemout ShouldContainSubstring Location: /login'

  - name: a sign-in post without the form's token is refused
    steps:
      # The right password with no token is still 403: the check answers before
      # anything reads the credential, and no session cookie is staged.
      - type: exec
        script: curl -sS -i -c .venom-csrf -d "username=admin&password={{.password}}" -w '\nSTATUS %{http_code}\n' {{.host}}/login
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 403
          - result.systemout ShouldContainSubstring did not carry the sign-in form
          - 'result.systemout ShouldNotContainSubstring Set-Cookie: session'
      # A token field whose cookie half is absent fails the same way: the pair
      # has to agree, not merely exist.
      - type: exec
        script: |
          curl -sS -b .venom-csrf -d "csrf=mismatched&username=admin&password={{.password}}" -w '\nSTATUS %{http_code}\n' {{.host}}/login
          rm -f .venom-csrf
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 403
          - result.systemout ShouldContainSubstring did not carry the sign-in form

  - name: repeated refusals hit the sign-in rate limit
    steps:
      # Six wrong passwords from one address cross the five-refusal ceiling.
      # The first five come back as ordinary refusals; the output asserted on
      # is the sixth.
      - type: exec
        script: |
          for n in 1 2 3 4 5; do
            curl -sS -o /dev/null -b "csrf=venomtoken" -d "csrf=venomtoken&username=admin&password=wrong-password" {{.host}}/login
          done
          curl -sS -b "csrf=venomtoken" -d "csrf=venomtoken&username=admin&password=wrong-password" -w '\nSTATUS %{http_code}\n' {{.host}}/login
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 429
          - result.systemout ShouldContainSubstring Too many sign-in attempts
      # The limit answers before the password is read, so the right password
      # gets the same 429 and costs the server no derivation: a guessing
      # client learns nothing by mixing a real candidate in.
      - type: exec
        script: curl -sS -b "csrf=venomtoken" -d "csrf=venomtoken&username=admin&password={{.password}}" -w '\nSTATUS %{http_code}\n' {{.host}}/login
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 429
          - result.systemout ShouldContainSubstring Too many sign-in attempts
      # Wait out the ten-second window, so the sign-in that follows starts
      # with a clean counter.
      - type: exec
        script: sleep 11
        assertions:
          - result.code ShouldEqual 0

  - name: signing in stages an http-only session cookie
    steps:
      # The long way, deliberately: read the form, take the token it rendered
      # and the cookie that came with it, and post both back. This is the step
      # that proves a browser's sign-in works end to end.
      - type: exec
        script: |
          TOKEN=$(curl -sS -c .venom-jar {{.host}}/login | sed -n 's/.*name="csrf" value="\([0-9a-f]*\)".*/\1/p')
          curl -sS -i -b .venom-jar -c .venom-jar -d "csrf=$TOKEN&username=admin&password={{.password}}" -w '\nSTATUS %{http_code}\n' {{.host}}/login
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 302
          - 'result.systemout ShouldContainSubstring Location: /'
          - result.systemout ShouldContainSubstring HttpOnly
          - result.systemout ShouldContainSubstring SameSite=Lax
      # The session names the account, and the header prints it.
      - type: exec
        script: curl -sS -b .venom-jar -w '\nSTATUS %{http_code}\n' {{.host}}/
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - 'result.systemout ShouldContainSubstring class="who">admin'
          - result.systemout ShouldContainSubstring Sign out
      # A visitor who already has a session has nothing to do on the form.
      - type: exec
        script: curl -sS -i -b .venom-jar -w '\nSTATUS %{http_code}\n' {{.host}}/login
        assertions:
          - result.systemout ShouldContainSubstring STATUS 302
          - 'result.systemout ShouldContainSubstring Location: /'

  - name: remove the scratch tables an earlier run left
    steps:
      - type: exec
        script: curl -sS -b .venom-jar --data-urlencode "query=DROP TABLE IF EXISTS venom_rows" -w '\nSTATUS %{http_code}\n' {{.host}}/sql
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
      - type: exec
        script: curl -sS -b .venom-jar --data-urlencode "query=DROP TABLE IF EXISTS venom_scratch" -w '\nSTATUS %{http_code}\n' {{.host}}/sql
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
      - type: exec
        script: curl -sS -b .venom-jar --data-urlencode "query=DELETE FROM catalogue WHERE name LIKE 'Venom%'" -w '\nSTATUS %{http_code}\n' {{.host}}/sql
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200

  - name: dashboard lists the migrated tables
    steps:
      - type: exec
        script: curl -sS -b .venom-jar -w '\nSTATUS %{http_code}\n' {{.host}}/
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring catalogue
          - result.systemout ShouldContainSubstring migrations
          - result.systemout ShouldContainSubstring Table catalogue

  - name: the user table is a view of the password file
    steps:
      # The accounts are browsable like any other table, because that is all
      # they are: users.php rebuilds this table from .htpasswd at startup, and
      # no password column exists anywhere in the schema.
      - type: exec
        script: curl -sS -b .venom-jar -w '\nSTATUS %{http_code}\n' {{.host}}/table/user
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring admin
          - result.systemout ShouldContainSubstring reader
          - result.systemout ShouldContainSubstring 2 matching rows
      # The id is the ULID computed from the username: the Crockford base32 of
      # the first 128 bits of sha256(name), which is what the same digest
      # printed through php answers. The query carries no string literal, so
      # the quoting is the table name's alone.
      - type: exec
        script: curl -sS -b .venom-jar --data-urlencode 'query=SELECT id, username FROM "user" ORDER BY username' -w '\nSTATUS %{http_code}\n' {{.host}}/sql
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring 4CD5VEBDA10GAVVT88QN6YW5EZ
          - result.systemout ShouldContainSubstring 1X150SCJN3XFEB036EYP5HQCWS
      - type: exec
        script: curl -sS -b .venom-jar -w '\nSTATUS %{http_code}\n' {{.host}}/table/user/structure
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring username
          - result.systemout ShouldNotContainSubstring password

  - name: browse shows the seeded rows
    steps:
      - type: exec
        script: curl -sS -b .venom-jar -w '\nSTATUS %{http_code}\n' {{.host}}/table/catalogue
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring SQLite Handbook
          - result.systemout ShouldContainSubstring Desk Lamp
          - result.systemout ShouldContainSubstring Local database
          - result.systemout ShouldContainSubstring 3 matching rows

  - name: browse filters on the search term
    steps:
      - type: exec
        script: curl -sS -b .venom-jar -w '\nSTATUS %{http_code}\n' '{{.host}}/table/catalogue?q=Handbook'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring SQLite Handbook
          - result.systemout ShouldNotContainSubstring Desk Lamp

  - name: browse paginates past the seeded rows
    steps:
      - type: exec
        script: curl -sS -b .venom-jar -w '\nSTATUS %{http_code}\n' '{{.host}}/table/catalogue?page=2'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring No rows found.

  - name: structure reports columns and the create statement
    steps:
      - type: exec
        script: curl -sS -b .venom-jar -w '\nSTATUS %{http_code}\n' {{.host}}/table/catalogue/structure
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring created_at
          - result.systemout ShouldContainSubstring CREATE TABLE catalogue
          - result.systemout ShouldContainSubstring Danger zone

  - name: export returns csv
    steps:
      - type: exec
        script: curl -sS -i -b .venom-jar -w '\nSTATUS %{http_code}\n' {{.host}}/table/catalogue/export
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring text/csv
          - result.systemout ShouldContainSubstring catalogue.csv
          - result.systemout ShouldContainSubstring created_at
          - result.systemout ShouldContainSubstring SQLite Handbook

  - name: sql console runs its default query
    steps:
      - type: exec
        script: curl -sS -b .venom-jar -w '\nSTATUS %{http_code}\n' {{.host}}/sql
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring 3 row(s) returned
          - result.systemout ShouldContainSubstring SQLite Handbook

  - name: sql console runs a query from the url
    steps:
      - type: exec
        script: curl -sS -b .venom-jar -w '\nSTATUS %{http_code}\n' '{{.host}}/sql?query=SELECT+COUNT(*)+AS+total+FROM+catalogue'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring 1 row(s) returned
          - result.systemout ShouldContainSubstring total

  - name: sql console executes a posted query
    steps:
      - type: exec
        script: curl -sS -b .venom-jar --data-urlencode "query=SELECT name FROM catalogue ORDER BY id LIMIT 1" -w '\nSTATUS %{http_code}\n' {{.host}}/sql
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring 1 row(s) returned
          - result.systemout ShouldContainSubstring SQLite Handbook

  - name: create table form offers the dialect presets
    steps:
      - type: exec
        script: curl -sS -b .venom-jar -w '\nSTATUS %{http_code}\n' {{.host}}/table/create
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring New database table
      - type: exec
        script: curl -sS -b .venom-jar -w '\nSTATUS %{http_code}\n' '{{.host}}/table/create?engine=pgsql'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring selected>PostgreSQL

  - name: insert form renders the columns
    steps:
      - type: exec
        script: curl -sS -b .venom-jar -w '\nSTATUS %{http_code}\n' {{.host}}/table/catalogue/insert
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring Insert row
          - result.systemout ShouldContainSubstring value_1

  - name: edit form loads an existing row
    steps:
      - type: exec
        script: curl -sS -b .venom-jar -w '\nSTATUS %{http_code}\n' {{.host}}/table/catalogue/row/1/edit
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring Update row
          - result.systemout ShouldContainSubstring SQLite Handbook

  - name: a table can be created from the form
    steps:
      - type: exec
        script: |
          curl -sS -L -b .venom-jar \
            -d "table_name=venom_rows&engine=sqlite&column_count=2&name_1=id&type_1=INTEGER&default_1=&pk_1=1&name_2=label&type_2=TEXT&default_2=" \
            -w '\nSTATUS %{http_code}\n' {{.host}}/table/create
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring CREATE TABLE &quot;venom_rows&quot;
          - result.systemout ShouldContainSubstring label
      - type: exec
        script: curl -sS -b .venom-jar {{.host}}/
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring venom_rows

  - name: a row can be inserted, edited and deleted
    steps:
      - type: exec
        script: curl -sS -L -b .venom-jar -d "null_0=1&value_1=Venom probe" -w '\nSTATUS %{http_code}\n' {{.host}}/table/venom_rows/insert
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring Venom probe
          - result.systemout ShouldContainSubstring 1 matching rows
      - type: exec
        script: curl -sS -L -b .venom-jar -d "value_0=1&value_1=Venom probe renamed" -w '\nSTATUS %{http_code}\n' {{.host}}/table/venom_rows/row/1/edit
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring Venom probe renamed
      - type: exec
        # -d "" and not -X POST: -X would keep the method on the redirect that
        # follows, and POST to the browse page is not a route.
        script: curl -sS -L -b .venom-jar -d "" -w '\nSTATUS %{http_code}\n' {{.host}}/table/venom_rows/row/1/delete
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldNotContainSubstring Venom probe
          - result.systemout ShouldContainSubstring No rows found.

  - name: a table can be dropped after confirmation
    steps:
      - type: exec
        script: curl -sS -L -b .venom-jar -d "confirmation=venom_rows" -w '\nSTATUS %{http_code}\n' {{.host}}/table/venom_rows/drop
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring Table catalogue
          - result.systemout ShouldNotContainSubstring venom_rows

  - name: dropping requires a matching confirmation
    steps:
      - type: exec
        script: curl -sS -b .venom-jar -d "confirmation=wrong" -w '\nSTATUS %{http_code}\n' {{.host}}/table/catalogue/drop
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring Confirmation did not match the table name.
      - type: exec
        script: curl -sS -b .venom-jar -w '\nSTATUS %{http_code}\n' {{.host}}/table/catalogue
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring 3 matching rows

  - name: unknown and invalid table names are rejected
    steps:
      - type: exec
        script: curl -sS -b .venom-jar -w '\nSTATUS %{http_code}\n' {{.host}}/table/nope
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring Table not found.
      - type: exec
        script: curl -sS -b .venom-jar -w '\nSTATUS %{http_code}\n' {{.host}}/table/bad-name
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring Invalid table name.

  - name: static assets are served from the web root
    steps:
      # The document root is public/, so the password file in the application
      # root is not reachable over HTTP at all - by either spelling.
      - type: exec
        script: curl -sS -i -w '\nSTATUS %{http_code}\n' {{.host}}/assets/style.css
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring text/css
      - type: exec
        script: curl -sS -o /dev/null -w 'STATUS %{http_code}\n' {{.host}}/.htpasswd
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 404
      - type: exec
        script: curl -sS -b .venom-jar -o /dev/null -w 'STATUS %{http_code}\n' {{.host}}/../.htpasswd
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldNotContainSubstring STATUS 200

  - name: a user added to the password file signs in after a reload
    steps:
      # The file is the user database, so adding an account is a line and a
      # reload. @startup jobs run again on SIGHUP, which is what rebuilds the
      # user table; nothing invalidates a cache and no request is dropped.
      - type: exec
        script: |
          echo 'venom:{{.venom_hash}}' >> ../.htpasswd
          {{.reload}}
          sleep 2
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: curl -sS -b .venom-jar -w '\nSTATUS %{http_code}\n' {{.host}}/table/user
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldContainSubstring venom
          - result.systemout ShouldContainSubstring 3 matching rows
      # The session the suite signed in with is still the session: storage is
      # on disk and keyed by the application root, so a reload does not sign
      # anybody out.
      - type: exec
        script: curl -sS -b .venom-jar -w '\nSTATUS %{http_code}\n' {{.host}}/
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - 'result.systemout ShouldContainSubstring class="who">admin'
      # The new account signs in, with a session of its own.
      - type: exec
        script: |
          TOKEN=$(curl -sS -c .venom-other {{.host}}/login | sed -n 's/.*name="csrf" value="\([0-9a-f]*\)".*/\1/p')
          curl -sS -i -b .venom-other -c .venom-other -d "csrf=$TOKEN&username=venom&password=venomvenom" -w '\nSTATUS %{http_code}\n' {{.host}}/login
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 302
          - 'result.systemout ShouldContainSubstring Location: /'
      - type: exec
        script: curl -sS -b .venom-other -w '\nSTATUS %{http_code}\n' {{.host}}/
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - 'result.systemout ShouldContainSubstring class="who">venom'
      # Removing the account again takes the row and the sessions it signs:
      # the id was computed from the name, so nothing else is stored, and the
      # rebuild sweeps the sessions of every id the file stopped naming. The
      # jar stays on disk through this, because the next step is the cookie
      # the removed user kept.
      - type: exec
        script: |
          grep -v '^venom:' ../.htpasswd > .venom-htpasswd
          cp .venom-htpasswd ../.htpasswd
          rm -f .venom-htpasswd
          {{.reload}}
          sleep 2
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: curl -sS -b .venom-jar -w '\nSTATUS %{http_code}\n' {{.host}}/table/user
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - result.systemout ShouldNotContainSubstring venom
          - result.systemout ShouldContainSubstring 2 matching rows
      # The removed account is signed out everywhere it was signed in.
      - type: exec
        script: |
          curl -sS -i -b .venom-other -w '\nSTATUS %{http_code}\n' {{.host}}/
          rm -f .venom-other
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 302
          - 'result.systemout ShouldContainSubstring Location: /login'
      # The account that stayed keeps its session: the sweep took the ids the
      # file dropped and no others.
      - type: exec
        script: curl -sS -b .venom-jar -w '\nSTATUS %{http_code}\n' {{.host}}/
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - 'result.systemout ShouldContainSubstring class="who">admin'

  - name: signing out ends the session
    steps:
      # A post without the form's token signs nobody out, even from the client
      # that holds the session cookie: a cross-site page can make a browser
      # send that cookie, and the token is what it cannot supply.
      - type: exec
        script: curl -sS -i -b .venom-jar -d "" -w '\nSTATUS %{http_code}\n' {{.host}}/logout
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 403
          - result.systemout ShouldContainSubstring did not carry the sign-out form
      # The session survived the refused post.
      - type: exec
        script: curl -sS -b .venom-jar -w '\nSTATUS %{http_code}\n' {{.host}}/
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 200
          - 'result.systemout ShouldContainSubstring class="who">admin'
      # The sign-out button is a form in the header of every page, so the
      # token comes from the page the way a browser's click would carry it.
      - type: exec
        script: |
          TOKEN=$(curl -sS -b .venom-jar {{.host}}/ | sed -n 's/.*name="csrf" value="\([0-9a-f]*\)".*/\1/p' | head -n 1)
          curl -sS -i -b .venom-jar -c .venom-jar -d "csrf=$TOKEN" -w '\nSTATUS %{http_code}\n' {{.host}}/logout
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 302
          - 'result.systemout ShouldContainSubstring Location: /login'
          - result.systemout ShouldContainSubstring Max-Age=0
      # The cookie the client kept is worth nothing: the stored session is
      # gone, not only the cookie.
      - type: exec
        script: curl -sS -i -b .venom-jar -w '\nSTATUS %{http_code}\n' {{.host}}/
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring STATUS 302
          - 'result.systemout ShouldContainSubstring Location: /login'
      - type: exec
        script: rm -f .venom-jar
        assertions:
          - result.code ShouldEqual 0
