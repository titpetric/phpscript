tasks:
  default:
    cmds:
      - goimports -w .
      - go fmt ./...
      - go mod tidy
      - go test ./...
      - go install .
      - task: test:phpscript:run

  test:phpscript:run:
    dir: tests/fixtures
    passthru: true
    cmds:
      - phpscript test-minitpl.php
      - php test-minitpl.php
      - ./test-shebang
