# A -mod=mod inherited from the environment makes every go command fail when the
# checkout sits in a go.work; clearing it lets go pick the mode itself, which is
# readonly in a module and the workspace build otherwise.
env:
  vars:
    GOFLAGS: ""

tasks:
  default:
    cmds:
      - go mod tidy
      - goimports -w .
      - goimports-reviser -set-alias -format -imports-order "std,blanked,general,company,project" ./...
      - go fmt ./...
      - go install .
      - task: composer:install
      - task: go:test
      - task: go:build
      - task: docker:build
      - task: up
      - task: test:introspection
      - task: test:phpscript:run
      - task: test:demos:dbadmin
      - task: test:demos:example

  # titpetric/minitpl is pulled in per project rather than vendored by hand, so
  # every tree with a composer.json is installed before the Go tests (the parser
  # benchmarks read the engine sources) and before the demos are packaged into
  # the image.
  composer:install:
    passthru: true
    cmds:
      - for dir in demos/example demos/dbadmin; do (cd $dir && composer install --no-interaction); done

  # The demos are compose services, so their venom suites run against the image
  # built above. They have their own pipelines because they have to resolve the
  # address of their container first.
  test:demos:dbadmin:
    dir: demos/dbadmin/tests
    passthru: true
    cmds:
      - atkins --final test

  test:demos:example:
    dir: demos/example/tests
    passthru: true
    cmds:
      - atkins --final test

  test:introspection:
    passthru: true
    cmds:
      - ./scripts/list-apis.php > docs/reference/extensions/implemented-apis.md
      - ./scripts/phpinfo.php
      - cd docs/reference && php README.php > README.md
      - task: mdox:fmt

  test:phpscript:run:
    dir: tests/fixtures
    passthru: true
    env:
      include: .env.testing
    cmds:
      - phpscript test-database.php
      - phpscript test-hello-world.php
      - php test-hello-world.php
      - ./test-shebang

  lint:
    passthru: true
    cmds:
      - gofsck ./...
      - go-fsck lint ./...

  gen:architecture:
    aliases: [gen]
    desc: "Generate architectural diagrams of the project"
    passthru: true
    cmds:
      - defer: rm -f go-fsck.json
      - go-fsck extract ./...
      - go-fsck docs --render imports | plantuml -tsvg -pipe > docs/assets/imports.svg
      - go-fsck docs --render puml | plantuml -tsvg -pipe > docs/assets/structure.svg
      - go-ddd-stats -d2 - | d2 --layout elk - docs/assets/size.svg
