# A -mod=mod inherited from the environment makes every go command fail when the
# checkout sits in a go.work; clearing it lets go pick the mode itself, which is
# readonly in a module and the workspace build otherwise.
env:
  vars:
    GOFLAGS: ""

# The demo trees, named once rather than spelled out per task. `demos.all` is
# every tree with a composer.json, which is what composer:install walks;
# `demos.venom` is the subset that is a compose service with a venom suite of
# its own. demos/common is in the first and not the second: it is a package
# whose fixtures sit beside its source, so it answers to test:phpscript:common
# rather than to a server.
vars:
  demos:
    all: [example, dbadmin]
    venom: [dbadmin, example]

tasks:
  # The default pipeline is what a change to the runtime has to pass: format,
  # build, test, run the fixtures on all three runtimes, regenerate the
  # documentation from the registered surface, and build the image.
  #
  # docker:build belongs here rather than with the demos. The image is what
  # compose:up and compose:down operate on, and what a deployment ships, so a
  # pipeline run leaves a current one behind whether or not anybody asked for
  # the demos.
  #
  # The demo suites are deliberately not here. They are compose services, and
  # running them costs the whole stack plus a venom suite per demo. That
  # answers a question about the demo applications, not about the runtime.
  # `atkins test:demos` runs them against the image this pipeline built, and a
  # change under demos/ is expected to.
  # Formatting is one notion: the Go source and the markdown together. Every
  # place that formats invokes this task, never go:fmt or mdox:fmt alone, so
  # the two cannot drift apart. It runs twice in default: once ahead of the
  # build, and once at the end over the documentation the pipeline generated.
  # The two tools this file's jobs call by name, at the revision their
  # repositories have rather than at their newest tag: both change under this
  # repository rather than for it, so a tag would lag a fix made for a job here.
  # splint renders the coverage reports and gates the lint ratchet; summary
  # renders the dbadmin pair.
  #
  # mdox is not here. `atkins mdox:setup` installs it, and that task carries
  # `interactive: true`, which fails with no tty, so delegating to it would make
  # this task fail wherever there is no terminal.
  #
  # php, docker, venom and atkins itself are not go installable and belong to
  # the image; dockerfiles/claude builds them in.
  setup:
    desc: "Install the tools the pipeline calls"
    passthru: true
    cmds:
      - go install github.com/titpetric/exp/cmd/summary@main
      - go install github.com/titpetric/tools/splint@main

  fmt:
    desc: "Format the Go source and the markdown"
    cmds:
      - task: go:fmt
      - task: mdox:fmt

  default:
    cmds:
      - task: fmt
      - task: go:test
      - task: cover
      - task: build
      - task: db:down
        deferred: true
      - task: db:up
      - task: test:phpscript:run
      - task: test:phpscript:matrix
      - task: test:lifecycle
      - task: test:introspection
      - task: fmt

  # The build alone, without the docs regeneration the default pipeline runs
  # first. cover rewrites docs/coverage/ right before go:build, and a rewrite
  # leaves the index stale, so a binary built by `atkins` carries a -dirty
  # version stamp even when nothing changed. Release assets come from here:
  # tag, `atkins build`, then release:publish.
  build:
    desc: "Build the release binary and the docker image, skipping docs regeneration"
    cmds:
      - go install .
      - task: go:build
      - task: docker:build

  # mysql and postgres are test infrastructure, not demos: test-database.php and
  # the platform_database fixtures query all three dialects, and sqlite alone
  # would not catch a dialect divergence. Both publish a port to the host, so
  # they come up without the image the demos need.
  db:up:
    desc: "Start the mysql and postgres services the database fixtures query"
    passthru: true
    cmds:
      - docker compose up -d --wait mysql postgres

  db:down:
    desc: "Stop the mysql and postgres services"
    passthru: true
    cmds:
      - docker compose stop mysql postgres

  # Both venom suites against the compose stack. It runs the image the default
  # pipeline built rather than building one, so a demo run measures whatever
  # was last released rather than whatever is in the tree; run `atkins` first
  # when that distinction matters. The stack comes down whether or not the
  # suites passed.
  test:demos:
    desc: "Run the demo venom suites against the compose stack"
    cmds:
      - task: composer:install
      - task: compose:up
      - task: compose:down
        deferred: true
      - task: test:demos:venom
      - task: gen:coverage:dbadmin

  # titpetric/minitpl is pulled in per project rather than vendored by hand, so
  # every tree with a composer.json is installed before the demo suites run.
  # No Go test reads these trees, which is why the default pipeline skips this:
  # it belongs to test:demos, the job that executes them.
  #
  # A for: over the list rather than a shell loop, because the shell one took
  # the exit code of its last iteration: a failed install in demos/example
  # passed the task as long as the one after it worked.
  composer:install:
    passthru: true
    cmds:
      - for: demo in demos.all
        dir: demos/${{ demo }}
        run: composer install --no-interaction

  # The demos are compose services, so their venom suites run against the image
  # test:demos builds. Each has a pipeline of its own because it has to resolve
  # the address of its container first, which is why this delegates to
  # `atkins test` in the demo's tests/ rather than running venom here. One task
  # over the list: the command is the same in every tree, only the directory it
  # runs from differs.
  test:demos:venom:
    passthru: true
    cmds:
      - for: demo in demos.venom
        dir: demos/${{ demo }}/tests
        run: atkins --final test

  test:introspection:
    passthru: true
    cmds:
      - go run ./scripts/list-apis > docs/reference/extensions/implemented-apis.md
      - phpscript info
      - cd docs/reference && php README.php > README.md

  # Every fixture runs on all three runtimes, so a divergence between the two
  # Go runtimes, or between phpscript and php itself, fails the pipeline.
  #
  # The ./... is load-bearing: fixtures live in per-area subfolders, and a bare
  # path is not recursive, so without it the job would match nothing and pass.
  #
  # One run produces both outputs: -o writes the checked-in report while the
  # ansi table still goes to the terminal, so the suite is not executed twice
  # to report it twice. The report is generated documentation, so this runs
  # before the closing fmt pass that formats everything under docs/.
  # Written without --profile: timings would differ on every run and show up as
  # a diff in every commit.
  test:phpscript:matrix:
    tty: true # enable ansi
    passthru: true
    env:
      include: .env.testing
    cmds:
      - phpscript test --matrix -v -o docs/test-fixtures.md ./tests/...

  # The server's own lifecycle, driven as an operator drives it: a real
  # process, a real pidfile and a real signal. None of it is reachable from a
  # fixture, and the parts that matter most, that the pidfile names the
  # running process and that a refused reload leaves it serving, are not
  # reachable from a Go test in the same process either.
  test:lifecycle:
    passthru: true
    cmds:
      - ./scripts/test-lifecycle.sh

  test:phpscript:run:
    dir: tests/fixtures
    passthru: true
    env:
      include: .env.testing
    cmds:
      - phpscript test-database.php
      - phpscript test-hello-world.php
      - php test-hello-world.php
      - ./test-shebang

  # The go:test job writes cover/pkg.cov (see .atkins/skills/go.yml); this folds
  # the profile into splint's document of the tree and renders the two
  # checked-in reports under docs/coverage/ through the templates beside them.
  # cover/pkg.cov stays behind (gitignored) for `go tool cover -html`.
  #
  # splint rather than `summary coverfunc`: it reads the Go source as well as
  # the profile, so a row carries the cognitive complexity and the line count
  # next to the percentage, and it writes markdown tables rather than lines
  # that had to be fenced. The rows come out sorted, which the previous
  # pipeline needed `sort` for because summary wrote them in map order.
  #
  # Two documents rather than one: a per-package summary is what a reader
  # scans, and the per-function detail is what somebody looking for the gap
  # reads. Each is the same command with the other template.
  #
  # The dbadmin pair below stays on `summary coverfunc`: its input is PHP
  # coverage read off the running service, and splint parses Go source.
  #
  # mdox repads the status column afterwards, counting the emoji as one column
  # where splint counts two, so this job always leaves a diff that mdox:fmt
  # closes. The default pipeline ends with fmt, which is why a whole run leaves
  # the tree clean; `atkins cover` on its own does not, and the fix is to run
  # fmt rather than to chase the padding.
  cover:
    aliases: [gen:coverage:phpscript]
    desc: "Generate docs/coverage/phpscript*.md from the test run's coverage profile"
    cmds:
      - mkdir -p docs/coverage
      - splint coverage --append-coverage=cover/pkg.cov --template=docs/coverage/phpscript.md.tpl ./... > docs/coverage/phpscript.md
      - splint coverage --append-coverage=cover/pkg.cov --template=docs/coverage/phpscript-detail.md.tpl ./... > docs/coverage/phpscript-detail.md

  # The PHP half. cover/dbadmin.file.txt is written by the dbadmin venom suite
  # (demos/dbadmin/tests/atkins.yml), which reads it off the running service, so
  # this reports what an end to end run of the application actually executed.
  #
  # A tree with no measurement yet leaves the documents alone rather than
  # writing empty ones: `atkins test:demos` is what produces the input, and it
  # is not part of the default pipeline.
  gen:coverage:dbadmin:
    desc: "Generate docs/coverage/dbadmin*.md from the venom suite's coverage"
    cmds:
      - >
        test -s cover/dbadmin.file.txt
        || { echo "cover/dbadmin.file.txt is missing; run 'atkins test:demos' first" >&2; exit 0; }
      - mkdir -p docs/coverage
      - >
        test -s cover/dbadmin.file.txt || exit 0;
        { echo "# dbadmin coverage";
          echo;
          echo "<!-- Generated by: summary coverfunc --packages < cover/dbadmin.file.txt -->";
          echo;
          echo "Statement coverage of demos/dbadmin, measured by serving the venom";
          echo "suite in tests/venom.yml and reading /debug/phpscript/coverage off the";
          echo "running container. One row per folder;";
          echo "[dbadmin-detail.md](dbadmin-detail.md) has the same run per file.";
          echo;
          echo '```';
          summary coverfunc --packages < cover/dbadmin.file.txt;
          echo '```'; } > docs/coverage/dbadmin.md
      - >
        test -s cover/dbadmin.file.txt || exit 0;
        { echo "# dbadmin coverage, per file";
          echo;
          echo "<!-- Generated by: summary coverfunc --files < cover/dbadmin.file.txt | sort -->";
          echo;
          echo "The per-file detail behind [dbadmin.md](dbadmin.md).";
          echo;
          echo '```';
          summary coverfunc --files < cover/dbadmin.file.txt | sort;
          echo '```'; } > docs/coverage/dbadmin-detail.md

  # Deliberately not part of default: a bench sweep costs minutes of pinned
  # CPU and answers a performance question, not a correctness one. Pinned to
  # one core at top priority so two sweeps are comparable with
  # `benchstat before.txt after.txt`; bench.txt is gitignored, durable
  # numbers land as curated tables in docs/allocation-performance.md.
  bench:
    desc: "Run the benchmarks and summarise bench.txt with benchstat"
    timeout: 1200s
    passthru: true
    cmds:
      - taskset -c 3 nice -n -20 go test -run XXX -bench . -benchmem -benchtime 1s -count 3 ./... | tee bench.txt
      - benchstat bench.txt

  # splint exits 1 when it found anything at all, warnings included, and this
  # tree carries around a thousand of them: uncovered symbols, files whose name
  # does not match what is in them, sources with no test beside them. A job that
  # fails on all of it fails always and gates nothing, so the gate is a ratchet
  # over scripts/splint-baseline.json: the error class may not grow, the warnings
  # are printed with their movement, and a count that went down asks for the
  # baseline to come down with it. scripts/splint-gate.sh carries the reasoning.
  lint:
    passthru: true
    cmds:
      - ./scripts/splint-gate.sh

  # Every generated document in one target. The coverage pair over Go sources
  # regenerates from the profile the test job wrote; the dbadmin pair needs
  # `atkins test:demos` to have run, and says so rather than writing an empty
  # report.
  gen:
    desc: "Regenerate the diagrams and the coverage reports"
    cmds:
      - task: gen:architecture
      - task: cover
      - task: gen:coverage:dbadmin

  gen:architecture:
    desc: "Generate architectural diagrams of the project"
    passthru: true
    cmds:
      - defer: rm -f splint.json
      - splint --save ./...
      - splint docs --input splint.json --render imports | plantuml -tsvg -pipe > docs/assets/imports.svg
      - splint docs --input splint.json --render puml | plantuml -tsvg -pipe > docs/assets/structure.svg
      - splint sizes --input splint.json --render d2 | d2 --layout elk - docs/assets/size.svg
