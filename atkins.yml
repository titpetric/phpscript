tasks:
  default:
    env:
      include: .env.testing
    cmds:
      - go mod tidy
      - goimports -w .
      - go fmt ./...
      - go install .
      - CGO_ENABLED=0 go build -o bin/ .
      - task: docker:build
      - task: up
      - go test ./...
      - task: test:phpscript:run

  test:phpscript:run:
    dir: tests/fixtures
    passthru: true
    env:
      include: .env.testing
    cmds:
      - phpscript test-database.php
      - phpscript test-minitpl.php
      - php test-minitpl.php
      - ./test-shebang

  lint:
    passthru: true
    cmds:
      - gofsck ./...
      - go-fsck lint ./...
