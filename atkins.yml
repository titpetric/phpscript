tasks:
  default:
    env:
      include: .env.testing
    cmds:
      - go mod tidy
      - goimports -w .
      - go fmt ./...
      - go install .
      - task: go:test
      - task: go:build
      - task: docker:build
      - task: up
      - task: test:introspection
      - task: test:phpscript:run

  test:introspection:
    passthru: true
    cmds:
      - ./scripts/list-apis.php > docs/reference/extensions/implemented-apis.md
      - ./scripts/phpinfo.php

  test:phpscript:run:
    dir: tests/fixtures
    passthru: true
    env:
      include: .env.testing
    cmds:
      - phpscript test-database.php
      - phpscript test-minitpl.php
      - php test-minitpl.php
      - ./test-shebang

  lint:
    passthru: true
    cmds:
      - gofsck ./...
      - go-fsck lint ./...
