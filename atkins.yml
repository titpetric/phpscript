# A -mod=mod inherited from the environment makes every go command fail when the
# checkout sits in a go.work; clearing it lets go pick the mode itself, which is
# readonly in a module and the workspace build otherwise.
env:
  vars:
    GOFLAGS: ""

tasks:
  default:
    cmds:
      - go mod tidy
      - goimports -w .
      - goimports-reviser -set-alias -format -imports-order "std,blanked,general,company,project" ./...
      - go fmt ./...
      - go install .
      - task: composer:install
      - task: go:test
      - task: go:build
      - task: docker:build
      - task: up
      - task: test:phpscript:run
      - task: test:phpscript:matrix
      - task: test:phpscript:report
      - task: test:introspection
      - task: test:demos:dbadmin
      - task: test:demos:example

  # titpetric/minitpl is pulled in per project rather than vendored by hand, so
  # every tree with a composer.json is installed before the Go tests (the parser
  # benchmarks read the engine sources) and before the demos are packaged into
  # the image.
  composer:install:
    passthru: true
    cmds:
      - for dir in demos/example demos/dbadmin; do (cd $dir && composer install --no-interaction); done

  # The demos are compose services, so their venom suites run against the image
  # built above. They have their own pipelines because they have to resolve the
  # address of their container first.
  test:demos:dbadmin:
    dir: demos/dbadmin/tests
    passthru: true
    cmds:
      - atkins --final test

  test:demos:example:
    dir: demos/example/tests
    passthru: true
    cmds:
      - atkins --final test

  test:introspection:
    passthru: true
    cmds:
      - go run ./scripts/list-apis > docs/reference/extensions/implemented-apis.md
      - phpscript info
      - cd docs/reference && php README.php > README.md
      - task: mdox:fmt

  # Every fixture runs on all three runtimes, so a divergence between the two
  # Go runtimes, or between phpscript and php itself, fails the pipeline.
  #
  # The ./... is load-bearing: fixtures live in per-area subfolders, and a bare
  # path is not recursive, so without it the job would match nothing and pass.
  test:phpscript:matrix:
    dir: tests/fixtures
    tty: true # enable ansi
    passthru: true
    env:
      include: .env.testing
    cmds:
      - phpscript test --matrix -v ./...

  # The fixture report is generated documentation, so it is written before
  # test:introspection, whose last step formats everything under docs/. Written
  # without --profile: timings would differ on every run and show up as a diff
  # in every commit.
  test:phpscript:report:
    dir: tests/fixtures
    passthru: true
    env:
      include: .env.testing
    cmds:
      - phpscript test --matrix -o ../../docs/test-fixtures.md ./...

  test:phpscript:run:
    dir: tests/fixtures
    passthru: true
    env:
      include: .env.testing
    cmds:
      - phpscript test-database.php
      - phpscript test-hello-world.php
      - php test-hello-world.php
      - ./test-shebang

  lint:
    passthru: true
    cmds:
      - gofsck ./...
      - go-fsck lint ./...

  gen:architecture:
    aliases: [gen]
    desc: "Generate architectural diagrams of the project"
    passthru: true
    cmds:
      - defer: rm -f go-fsck.json
      - go-fsck extract ./...
      - go-fsck docs --render imports | plantuml -tsvg -pipe > docs/assets/imports.svg
      - go-fsck docs --render puml | plantuml -tsvg -pipe > docs/assets/structure.svg
      - go-ddd-stats -d2 - | d2 --layout elk - docs/assets/size.svg
