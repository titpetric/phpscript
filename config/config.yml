# Includes, limits and trace level for every run. docs/configuration.md#runner names each key.
runner:
  work_dir: "."
  areas: []
  precompile: true
  trace_level: info
  writable_paths: []
  include: ""
  upload_max_filesize: 2M
  post_max_size: 8M
  upload_file_mode: "0644"
  memory_limit: 0
  time_limit: 0
  concurrency_limit: 0

flatstack:
  enabled: false

routes:
  enabled: true

# The defaults `phpscript test` runs under. docs/configuration.md#test-suites names the scope of each key.
test:
  include: ""
  hooks:
    setup: ""
    teardown: ""
  parallel: 1
  cache: worker
  skip_php: false

# The listen address, the module list and the pid file a reload reads. docs/configuration.md#server.
server:
  addr: ":8080"
  quiet: false
  modules: []
  pid_file: ""

# The recorder the platform builds and the debug front end it mounts. docs/configuration.md#telemetry.
telemetry:
  enabled: true
  path: "/debug/oida"
  service_name: "phpscript"
  ring_buffer_size: 200
  top_requests: 20
  sample_rate: 100
  track_memory_use: true
  live_stream: true
  driver: memory

# The servers `mail()` and `new Mail($name)` deliver through, keyed by name. docs/configuration.md#mail-servers.
mail: {}

# The directory beneath an application root the server publishes over HTTP. docs/configuration.md#document-root.
document_root: public

# List a directory that holds no index page, the way nginx's `autoindex on;` does. docs/configuration.md#autoindex.
autoindex: false

# The sites this server answers for, one entry per domain. docs/configuration.md#virtual-hosts.
virtualhost: []

env:
  - "PLATFORM_DB_SQLITE_TEST=sqlite://:memory:"
