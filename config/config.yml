runner:
  work_dir: "."
  writable_paths: []

flatstack:
  enabled: false

routes:
  enabled: true

telemetry:
  enabled: true
  path: "/debug/oida"
  service_name: "phpscript"
  ring_buffer_size: 200
  top_requests: 20
  sample_rate: 100
  track_memory_use: true
  live_stream: true
  driver: memory

env:
  - "PLATFORM_DB_SQLITE_TEST=sqlite://:memory:"
