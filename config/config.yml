runner:
  work_dir: "."
  writable_paths: []
  # Upload limits, spelled and defaulted as php.ini spells them. A bare number
  # is bytes and an M suffix is megabytes; nothing else parses, and 0 is no
  # limit.
  upload_max_filesize: 2M
  post_max_size: 8M
  # The mode move_uploaded_file() gives a stored upload. Octal, as chmod takes
  # it; the temporary copy an upload arrives in is private to the process.
  upload_file_mode: "0644"

flatstack:
  enabled: false

routes:
  enabled: true

server:
  addr: ":8080"
  quiet: false
  modules: []

# The platform is the recorder: it wraps every module in the tracing
# middleware and mounts the debug front end under path. phpscript adds no
# recorder of its own, it reports interpreter work onto the trace the
# middleware started, so it shows up on the same front end.
telemetry:
  enabled: true
  path: "/debug/oida"
  service_name: "phpscript"
  ring_buffer_size: 200
  top_requests: 20
  sample_rate: 100
  track_memory_use: true
  live_stream: true
  driver: memory

env:
  - "PLATFORM_DB_SQLITE_TEST=sqlite://:memory:"
