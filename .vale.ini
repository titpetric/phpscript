StylesPath = .vale/styles
MinAlertLevel = suggestion

# Only the repository's own style. No packages are downloaded, so the lint needs
# no network and reports the same findings on every machine.
#
# Every rule is level: error, so vale exits non-zero on any of them. The three
# that used to be level: warning printed and passed, which is how two findings
# in testdata sat in the tree while the job reported success.
[*.md]
BasedOnStyles = llm-slop

# A doc comment is prose and is held to the same rules. No rule is off for a
# language: the one that collided with Go and PHP identifiers, Abbreviation,
# dropped the two tokens that collided instead.
[*.go]
BasedOnStyles = llm-slop

# A PHP comment is prose too, and until this section existed no linter in the
# pipeline read one: splint parses Go, and `phpscript lint` reports undefined
# names, unreachable code and unused variables.
[*.php]
BasedOnStyles = llm-slop

# An agent worktree is a checkout of these same files, so counting one
# multiplies every finding by the number of worktrees. composer writes the
# other, and third-party markdown is not ours to rewrite.
[.claude/**]
BasedOnStyles =

[demos/*/vendor/**]
BasedOnStyles =

# The template's checklist is written in the first person because a human
# author ticks it. AgentNarration is for prose that reports the work instead of
# the change.
[.github/PULL_REQUEST_TEMPLATE.md]
llm-slop.AgentNarration = NO
