StylesPath = .vale/styles
MinAlertLevel = suggestion

# One style, vendored under .vale/styles, so the lint needs no network and
# reports the same findings on every machine. Five of its thirty-five rules
# come from write-good and each one says so in its own header, with the
# upstream it was taken from and the licence it carries.
#
# One section for markdown, Go and PHP together, because the three are held to
# the same rules. A doc comment and a PHP comment are prose. Until the *.php
# glob existed no linter in this pipeline read one: splint parses Go, and
# `phpscript lint` reports undefined names, unreachable code and unused
# variables.
#
# Every rule is level: error and no rule is off for a language. vale fails on
# any finding, so `atkins mdox:lint` prints and fails the way bare splint does,
# and the gate is the ratchet beside it: scripts/vale-gate.sh against
# scripts/vale-baseline.json, which `atkins lint` runs. Three rules carry a
# count there and come down from it; the other thirty-two are at zero and a
# single finding fails the gate.
#
# Abbreviation collided with the config and info identifiers, so it dropped
# those two tokens instead of being switched off per language. Three write-good
# rules stay out of the style: E-Prime, which bans every form of "to be" and
# reported 10714, and ThereIs and So, which reported 67 and 28.
[*.{md,go,php}]
BasedOnStyles = llm-slop

# An agent worktree is a checkout of these same files, so counting one
# multiplies every finding by the number of worktrees. composer writes the
# other, and third-party markdown is not ours to rewrite.
[.claude/**]
BasedOnStyles =

[demos/*/vendor/**]
BasedOnStyles =

# The template's checklist is written in the first person because a human
# author ticks it. AgentNarration is for prose that reports the work instead of
# the change.
[.github/PULL_REQUEST_TEMPLATE.md]
llm-slop.AgentNarration = NO
