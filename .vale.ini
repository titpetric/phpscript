StylesPath = .vale/styles
MinAlertLevel = suggestion

# One style, vendored under .vale/styles, so the lint needs no network and
# reports the same findings on every machine. The 45 rules are a copy of
# titpetric/titpetric/.vale/styles/llm-slop, synced whole, and five of them come
# from write-good: Cliches, Illusions, Passive, TooWordy and Weasel, each naming
# its upstream and its licence in its own header.
#
# Nothing, So and ColonRestatement target the absolute and the restating
# connector: name the fact that happens, join clauses with " and", and cut the
# clause a colon only repeats.
#
# One section for every language of the tree, because all of them are held to
# the same rules. A doc comment, a PHP comment, a shell comment and the label a
# page draws are prose. Until the *.php glob existed no linter in this pipeline
# read one: splint parses Go, and `phpscript lint` reports undefined names,
# unreachable code and unused variables.
#
# A template reads line by line, with no entry in a [formats] section. A .tpl is
# not HTML: a MiniTPL tag opens inside an attribute and inside a tag name, so
# the HTML reader drops every attribute value and the text of a pre or a code
# element. A placeholder and a title are prose a reader sees.
#
# vale knows no comment syntax for YAML either and reads one as plain text, so
# the *.yml glob covers a comment and a value together. Both are read: a
# comment above a key argues a decision, and the desc, name and summary a
# pipeline or a suite writes is the line a help page and a test report print.
# Until this glob existed the 217 comment lines of atkins.yml answered to
# nothing.
#
# Every rule is level: error and no rule is off for a language. vale fails on
# any finding, so `atkins mdox:lint` prints and fails the way bare splint does,
# and the gate is the ratchet beside it: scripts/vale-gate.sh against
# scripts/vale-baseline.json, which `atkins lint` runs. That file holds no rule
# now, so one finding anywhere fails the gate.
#
# Abbreviation collided with the config and info identifiers, so it dropped
# those two tokens instead of being switched off per language. Three write-good
# rules stay out of the style: E-Prime, which bans every form of "to be" and
# reported 10714, and ThereIs and So, which reported 67 and 28.
[*.{md,go,php,tpl,css,sh,sql,yml,yaml}]
BasedOnStyles = llm-slop

# Two trees nobody here writes. An agent worktree is a checkout of these same
# files, so counting one multiplies every finding by the number of worktrees;
# composer writes the other, at any depth - demos/dbadmin/vendor and
# testdata/php-vanilla/vendor today - and third-party prose is not ours to
# rewrite.
#
# scripts/vale-gate.sh hands vale the file list git reports, so the gate skips
# both of these without reading this file at all. These sections are for the
# runs that walk the tree instead: `vale .` by hand, and the reply hook.
[.claude/**]
BasedOnStyles =

[**/vendor/**]
BasedOnStyles =

# A rule file quotes the token it refuses. Illusions names the word written
# twice, Register names the register it bans, and every message states the
# phrase a writer is not to use. Reading the style with the style reports the
# style.
[.vale/**]
BasedOnStyles =

# A fixture is an input to a test. Its comments and its printed strings are the
# program under test, and the expected output beside it holds the same words, so
# a rewrite for prose breaks the assertion it feeds.
[tests/fixtures/**]
BasedOnStyles =

[**/testdata/**]
BasedOnStyles =

# A venom assertion is the same thing one directory up: ShouldContainSubstring
# names a string the application prints, and rewriting the prose here breaks
# the assertion instead of fixing the interface. The fix goes in the template
# and the assertion follows it.
[**/tests/venom.yml]
BasedOnStyles =

# vale knows no comment syntax for a shell script and reads one as plain text,
# keywords included. Illusions is write-good's repeated-word check, and two
# nested loops end on `done` under `done`, which it reads as a word written
# twice. Every other rule in the style needs a phrase a keyword does not spell.
[*.sh]
llm-slop.Illusions = NO

# A YAML file holds the commands a job runs, and `phpscript info` is one of
# them. AbbreviationSymbol reads the subcommand's own name as an abbreviation
# somebody chose, and backticks are no escape inside a command a shell runs.
# Every comment in the file still answers to the other 44 rules.
[*.{yml,yaml}]
llm-slop.AbbreviationSymbol = NO

# The template's checklist is written in the first person because a human
# author ticks it. AgentNarration is for prose that reports the work instead of
# the change.
[.github/PULL_REQUEST_TEMPLATE.md]
llm-slop.AgentNarration = NO
