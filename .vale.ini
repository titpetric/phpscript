StylesPath = .vale/styles
MinAlertLevel = suggestion

# Both styles are vendored under .vale/styles and no package is fetched at lint
# time, so the lint needs no network and reports the same findings on every
# machine.
#
# One section for markdown, Go and PHP together, because the three are held to
# the same rules. A doc comment and a PHP comment are prose. Until the *.php
# glob existed no linter in this pipeline read one: splint parses Go, and
# `phpscript lint` reports undefined names, unreachable code and unused
# variables.
#
# Every llm-slop rule is level: error, so vale exits non-zero on any of them.
# The three that used to be level: warning printed and passed, which is how two
# findings in testdata sat in the tree while the job reported success. No
# llm-slop rule is off anywhere: Abbreviation collided with the config and info
# identifiers and dropped those two tokens instead of being switched off per
# language.
#
# write-good is third party, so which of its rules this repository adopts is a
# decision and not an exemption. Five are adopted, with what each reported when
# it went in:
#
#	Illusions      6  a word duplicated across a line break, five of six real
#	Cliches        0
#	Weasel        83  mostly "several"
#	TooWordy    1167  overlaps llm-slop's Filler
#	Passive     3356
#
# The last three sit in scripts/vale-baseline.json and come down from there.
# vale passes them on its own, all three being level: warning, so
# scripts/vale-gate.sh is what holds the count.
#
# Three stay out. E-Prime reported 10714: it bans every form of "to be", which
# is a writing discipline and not a defect report. ThereIs and So are
# level: error upstream and would fail the build on 67 and 28 findings, so they
# go in behind a baseline when somebody works them down.
[*.{md,go,php}]
BasedOnStyles = llm-slop, write-good
write-good.E-Prime = NO
write-good.ThereIs = NO
write-good.So = NO

# An agent worktree is a checkout of these same files, so counting one
# multiplies every finding by the number of worktrees. composer writes the
# other, and third-party markdown is not ours to rewrite.
[.claude/**]
BasedOnStyles =

[demos/*/vendor/**]
BasedOnStyles =

# The template's checklist is written in the first person because a human
# author ticks it. AgentNarration is for prose that reports the work instead of
# the change.
[.github/PULL_REQUEST_TEMPLATE.md]
llm-slop.AgentNarration = NO
