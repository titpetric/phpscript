StylesPath = .vale/styles
MinAlertLevel = suggestion

# Only the repository's own style. No packages are downloaded, so the lint needs
# no network and reports the same findings on every machine.
[*.md]
BasedOnStyles = llm-slop

# A doc comment is prose and is held to the same rules, minus one. Abbreviation
# reads `config` and `info` in backticks as identifiers, and every site it
# reports in Go source is one: the config package, config/config.yml, the info
# command. Its escape hatch is unavailable here, because `go doc` renders a
# backtick as a backtick, so satisfying the rule would put punctuation into the
# published documentation of this module.
[*.go]
BasedOnStyles = llm-slop
llm-slop.Abbreviation = NO

# A PHP comment is prose too, and until this section existed no linter in the
# pipeline read one: splint parses Go, and `phpscript lint` reports undefined
# names, unreachable code and unused variables. Nothing renders these comments,
# so an identifier takes the backticks the rule asks for and no rule is off.
[*.php]
BasedOnStyles = llm-slop

# The seven generated documents. Two are committed and five are gitignored, and
# `atkins gen` writes all of them; their prose comes from README.php, from the
# doc comments scripts/list-apis reads, and from the .md.tpl beside each
# coverage pair, each of which is linted where it is written.
[docs/{test-fixtures.md,coverage/*.md,reference/README.md,reference/extensions/implemented-apis.md}]
BasedOnStyles =

# An agent worktree is a checkout of these same files, so counting one
# multiplies every finding by the number of worktrees. composer writes the
# other, and third-party markdown is not ours to rewrite.
[.claude/**]
BasedOnStyles =

[demos/*/vendor/**]
BasedOnStyles =

# A real image class from a ported application, kept as its author wrote it
# apart from the two branches image_class.phpt names as trimmed. Its phpdoc is
# what makes it a real class and not ours to rewrite.
[tests/fixtures/gd/Image.php]
BasedOnStyles =

# Two tokens Abbreviation reports that cannot take its backticks. One is the
# `/info` route path, which is the API's and matches the other four runtimes;
# the other is a phpdoc @param, which has to name the `$config` parameter the
# signature declares. Every other PHP site carries the backticks instead.
[{testdata/phpscript-service/info.php,docs/reference/README.php}]
llm-slop.Abbreviation = NO

# The template's checklist is written in the first person because a human
# author ticks it. AgentNarration is for prose that reports the work instead of
# the change.
[.github/PULL_REQUEST_TEMPLATE.md]
llm-slop.AgentNarration = NO
