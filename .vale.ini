StylesPath = .vale/styles
MinAlertLevel = suggestion

# Only the repository's own style. No packages are downloaded, so the lint needs
# no network and reports the same findings on every machine.
[*.md]
BasedOnStyles = llm-slop

# A doc comment is prose and is held to the same rules. MetricsInProse is off:
# it exempts tables, and a Go comment has none, so a measurement in one has
# nowhere else to go.
[*.go]
BasedOnStyles = llm-slop
llm-slop.MetricsInProse = NO

# The seven generated documents. Two are committed and five are gitignored, and
# `atkins gen` writes all of them; their prose comes from README.php, from the
# doc comments scripts/list-apis reads, and from the .md.tpl beside each
# coverage pair, each of which is linted where it is written.
[docs/{test-fixtures.md,coverage/*.md,reference/README.md,reference/extensions/implemented-apis.md}]
BasedOnStyles =

# An agent worktree is a checkout of these same files, so counting one
# multiplies every finding by the number of worktrees. composer writes the
# other, and third-party markdown is not ours to rewrite.
[.claude/**]
BasedOnStyles =

[demos/*/vendor/**]
BasedOnStyles =
