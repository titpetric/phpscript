title: phpscript language reference
description: A PHP language-reference-shaped guide to the syntax and runtime behavior implemented by phpscript.
compatibility:
  - feature: PHP language reference
    status: Partial compatibility
    notes: Only documented chapters and features are implemented.
  - feature: phpscript extensions
    status: Compatibility
    notes: Documented separately because these APIs and syntax do not exist in PHP.
  - feature: Fibers, generators, attributes, enums, stream contexts and wrappers
    status: Not implemented
    notes: Omitted from the sitemap because phpscript has no corresponding feature.
sitemap:
  - section: Syntax and values
    description: Source-file structure, runtime values, variables, constants, and expression evaluation.
    links:
      - path: basic-syntax/README.md
        description: PHP tags, inline HTML, statement separators, comments, and shebang scripts.
      - path: types/README.md
        description: Dynamic scalar, array, object, callable, and cast behavior.
      - path: types/value-semantics.md
        description: What copies and what is shared, why `&` does nothing, and how binding output parameters work.
      - path: variables/README.md
        description: Assignment, local scope, arrays, properties, and destructuring.
      - path: constants/README.md
        description: Class constants and values registered by an embedding host.
      - path: expressions/README.md
        description: Assignment, ternary, call, construction, and include expressions.
      - path: operators/README.md
        description: Supported operators, precedence, mutation, and unavailable PHP groups.
  - section: Control and composition
    description: Statements and declarations used to organize executable scripts.
    links:
      - path: control-structures/README.md
        description: Conditions, loops, switches, jumps, returns, and includes.
      - path: functions/README.md
        description: Named functions, closures, arguments, defaults, and keyword differences.
      - path: classes-and-objects/README.md
        description: Basic classes, properties, methods, constructors, and host-backed objects.
      - path: namespaces/README.md
        description: Namespace declarations, name resolution, function fallback, and autoloading.
  - section: Failures and runtime-provided values
    description: The supported error model and values supplied by the runtime or request host.
    links:
      - path: errors/README.md
        description: Parse failures, runtime errors, and the host error callback.
      - path: exceptions/README.md
        description: Throwing, catching, finally blocks, and differences from PHP exception dispatch.
      - path: predefined-variables/README.md
        description: Request query, form, upload, cookie, server and route variables, and the superglobals that stay empty.
      - path: predefined-interfaces-and-classes/README.md
        description: Exception and closure behavior, plus absent PHP runtime types.
      - path: predefined-interfaces-and-classes/reserved-interfaces.md
        description: Every interface and class PHP predefines, the version that added it, and what phpscript does about each.
      - path: predefined-interfaces-and-classes/classes/Traversable.md
        description: The base interface foreach detects, which cannot be implemented on its own.
      - path: predefined-interfaces-and-classes/classes/Iterator.md
        description: The five methods foreach calls, why nothing dispatches through them, and a flattened workaround.
      - path: predefined-interfaces-and-classes/classes/IteratorAggregate.md
        description: Handing back a separate iterator, and why getIterator() is never called.
      - path: predefined-interfaces-and-classes/classes/InternalIterator.md
        description: The engine-supplied iterator for internal classes.
      - path: predefined-interfaces-and-classes/classes/Throwable.md
        description: The base interface of everything thrown, supported in a catch clause and nowhere else.
      - path: predefined-interfaces-and-classes/classes/Countable.md
        description: The count() method count() does not call.
      - path: predefined-interfaces-and-classes/classes/ArrayAccess.md
        description: Indexing an object, and the absence of an overloaded index.
      - path: predefined-interfaces-and-classes/classes/Serializable.md
        description: Customized serializing, deprecated in PHP 8.1 and unimplemented here.
      - path: predefined-interfaces-and-classes/classes/Closure.md
        description: The class wrapping an anonymous function, whose value exists without it.
      - path: predefined-interfaces-and-classes/classes/stdClass.md
        description: The empty class new stdClass and the (object) cast both build.
      - path: predefined-interfaces-and-classes/classes/Generator.md
        description: What a function containing yield returns, and why there is no coroutine model.
      - path: predefined-interfaces-and-classes/classes/Fiber.md
        description: Interruptible call stacks, left to the embedding Go application.
      - path: predefined-interfaces-and-classes/classes/WeakReference.md
        description: A reference that does not keep its object alive, and why refcounts do not carry over.
      - path: predefined-interfaces-and-classes/classes/WeakMap.md
        description: A map keyed by object, resting on three unavailable features.
      - path: predefined-interfaces-and-classes/classes/Stringable.md
        description: The __toString() contract, and the magic method behind it.
      - path: predefined-interfaces-and-classes/classes/UnitEnum.md
        description: The interface the engine applies to every enumeration.
      - path: predefined-interfaces-and-classes/classes/BackedEnum.md
        description: The scalar-to-case mappings on a backed enumeration.
      - path: predefined-interfaces-and-classes/classes/SensitiveParameterValue.md
        description: The wrapper that keeps a secret out of a stack trace.
      - path: predefined-interfaces-and-classes/classes/__PHP_Incomplete_Class.md
        description: The placeholder unserialize() produces for a class it cannot build.
  - section: phpscript extensions
    description: Runtime-specific syntax and APIs that are not part of the PHP language reference.
    links:
      - path: extensions/README.md
        description: defer, bare host bindings, function keyword aliases, and portability hazards.
      - path: extensions/bindings.md
        description: Exposing Go constructors, functions, methods, contexts, and values to PHP.
      - path: extensions/plugins.md
        description: Registering bindings at run time from a compiled Go plugin, loaded by filename.
      - path: extensions/regexp.md
        description: How PCRE patterns are compiled, and what differs between PHP's PCRE and Go's RE2.
      - path: extensions/implemented-apis.md
        description: Generated inventory of functions and classes in the standard CLI runtime.
