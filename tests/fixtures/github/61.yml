name: a regex-constrained path parameter is readable through $_PATH
description: >
  Issue #61: chi enforces {id:[0-9]+} (a non-matching request 404s) and
  carries the value under "id", but the exporter only recognises {name} and
  {name...}, so $_PATH arrives empty. $_PATH["id"] must hold "123" for
  GET /b/123. Route registration is not reachable from the fixture runner
  today; the fixture records the expected export for when it is.
runner:
  php: false
---
<?php

// @route GET /b/{id:[0-9]+}
echo json_encode($_PATH), "\n";
---
{"id":"123"}
