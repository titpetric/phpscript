name: time namespace formats and parses through the Go layout
description: >
  Issue #64: no datetime API beyond time(). Constructs a known instant,
  formats it, round-trips it through parse. php cannot run this fixture; the
  compat date() layer gets its own matrix fixtures with expectations written
  from php's output.
runner:
  php: false
---
<?php

$t = time\parse("2006-01-02 15:04:05", "2026-08-26 14:48:00");
echo time\format($t, "2006-01-02"), "\n";
echo time\format($t, "15:04"), "\n";
echo time\unix($t), "\n";
---
2026-08-26
14:48
1787150880
