name: a splat path parameter matches the remaining segments and exports them
description: >
  Issue #62: {tail...} registers but never matches (the registration side
  never turns it into a chi wildcard), while the bare /* matches and exports
  nothing. The working spelling is {tail...} matching one-or-more remaining
  segments with the joined remainder in $_PATH["tail"], "one/two" for
  GET /c/one/two. Route registration is not reachable from the fixture
  runner today; the fixture records the expected export for when it is.
runner:
  php: false
---
<?php

// @route GET /c/{tail...}
echo json_encode($_PATH), "\n";
---
{"tail":"one/two"}
