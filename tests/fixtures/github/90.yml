name: getmypid is not bound, though posix_getpid is
description: >
  stdlib/pexec binds posix_getpid and stops there. In PHP that is the
  ext/posix spelling, an optional extension a host can be built without and
  one that does not exist on Windows; getmypid is core standard, always
  present, and returns the identical value. phpscript binds the optional name
  and not the mandatory one, so a ported file that types the portable
  spelling stops with: call to undefined function getmypid().

  The caller is mobius issue 67. Its fixture suite is not deterministic above
  -p 1 because MiniTPL compiles a template into a shared templates/cache/
  entry keyed on the template name, and two workers rendering the same name
  race on one entry. The fix is a compile directory per process, which needs
  a per-process key. mobius is not blocked - posix_getpid answers - but the
  name every other PHP codebase writes for that value is missing.

  This fixture bounds the report with the three spellings that do work:
  posix_getpid for the pid itself, putenv/getenv for a key handed to a
  process from outside, and bin2hex(random_bytes()) for a unique string.
  uniqid is deliberately absent from it: ulid() and uuid() already own that
  job, and the issue argues uniqid into the "Won't implement" table rather
  than into a binding.

  A pid differs per run, so every assertion is on shape - the type, that it
  is positive, and that it equals the binding that already answers.

  Reported: https://github.com/titpetric/phpscript/issues/90
---
<?php

// Works today: the process id, under the ext/posix spelling. This is the one
// binding that answers the question, and it is the optional name.
$pid = posix_getpid();
var_dump(is_int($pid));
var_dump($pid > 0);

// Works today: the environment, the other way a worker is handed an identity
// of its own from outside.
putenv("MOBIUS_WORKER=3");
var_dump(getenv("MOBIUS_WORKER"));

// Works today: a unique string without uniqid(). random_bytes and bin2hex are
// both bound, and ulid()/uuid() cover the same job with better ids.
var_dump(strlen(bin2hex(random_bytes(13))));
var_dump(bin2hex(random_bytes(8)) !== bin2hex(random_bytes(8)));

// What this issue asks for, and what fails: getmypid(), the core spelling of
// the value posix_getpid() already returns. Today the script stops here with
// "call to undefined function getmypid() (1:17)".
var_dump(is_int(getmypid()));
var_dump(getmypid() > 0);
var_dump(getmypid() === posix_getpid());
?>
