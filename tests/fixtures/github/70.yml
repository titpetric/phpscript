name: "self:: forwards $this to an instance method"
description: >
  Issue #70: inside an instance method, self::inner() is $this->inner() in
  everything but spelling, so the callee sees the instance. phpscript calls
  it without a receiver and every property reads empty. Passes under php
  unchanged: matrix-ready once fixed.
---
<?php

class W {
	public $v = 7;
	public function inner() { return "v=" . $this->v; }
	public function outer() { return self::inner(); }
}
$w = new W();
echo $w->outer(), "\n";
---
v=7
