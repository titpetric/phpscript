name: mail without smtp configuration fails loudly and catchably
description: >
  Issue #68: smtp.Register binds mail() to a host-configured sender and has
  no caller - only the SMTP class binding is registered - so a script calling
  mail() dies on an undefined function. Expected: function_exists is true
  and, with no smtp block configured, the call throws a catchable error
  naming the missing configuration, so calling code keeps its log-the-link
  fallback with one spelling.
runner:
  php: false
---
<?php

var_dump(function_exists("mail"));
try {
	mail("a@example.com", "s", "b");
	echo "sent\n";
} catch (Exception $e) {
	echo "refused: no smtp configured\n";
}
---
bool(true)
refused: no smtp configured
