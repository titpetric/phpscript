name: a declared DATETIME column survives the round trip to echo
description: >
  Issue #58: the driver scans a DATETIME column into a Go time that echoes as
  an empty string. Echoing it must produce the stored text, the same thing
  php prints when PDO returns the column as a string. Needs the sqlite_test
  credential from .env.testing.
runner:
  php: false
---
<?php

$db = new Database("sqlite_test");
$db->query("CREATE TABLE IF NOT EXISTS probe (id INTEGER PRIMARY KEY, created_at DATETIME NOT NULL DEFAULT '2026-08-26 14:48:00')");
$db->query("INSERT INTO probe (id) VALUES (1)");

$row = $db->get("SELECT created_at FROM probe");
echo $row["created_at"], "\n";
---
2026-08-26 14:48:00
