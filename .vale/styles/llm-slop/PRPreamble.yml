---
extends: existence
message: "'%s' is preamble. Open with the defect, in the code's own terms."
level: error
ignorecase: true
nonword: true
tokens:
  - '\bthis\s+(?:PR|pull\s+request|patch|changeset)\b'
  - '\bin\s+this\s+(?:PR|pull\s+request|change|commit)\b'
  - '\bthe\s+(?:goal|purpose|aim)\s+of\s+this\b'
  - '\bthis\s+(?:change|commit)\s+(?:adds|introduces|implements|provides)\b'
  - '\bat\s+a\s+high\s+level\b'
  - '\bTL;?DR\b'
