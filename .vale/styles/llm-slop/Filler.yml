---
extends: existence
message: "Filler transition: '%s'. Delete it."
level: error
ignorecase: true
nonword: true
tokens:
  - '(?:^|\.\s+)(?:Importantly|Interestingly|Notably|Crucially|Essentially|Ultimately|Fundamentally|Arguably|Remarkably|Indeed)\b'
  - '\bhere\s+is\s+(?:the\s+thing|where\s+it\s+gets)\b'
  - '\blet\s+us\s+(?:unpack|dig|look\s+at)\b'
  - '\bin\s+conclusion\b'
  - '\bto\s+sum\s+up\b'
  - '\bin\s+summary\b'
  - '\bto\s+summari[sz]e\b'
  - '\bsimply\s+put\b'
  - '\bthat\s+said\b'
  - '\bthat\s+being\s+said\b'
  - '\bwith\s+that\s+in\s+mind\b'
  - '\bat\s+the\s+end\s+of\s+the\s+day\b'
  - '\bwhen\s+all\s+is\s+said\b'
  - '\bneedless\s+to\s+say\b'
  - '\bas\s+(?:we|you)\s+(?:can\s+see|saw|know)\b'
  # Furthermore and Additionally stay out: the corpus writes them 3 and 13
  # times. Moreover it never writes.
  - '(?:^|\.\s+)Moreover\b'
  - '\bthe\s+journey\b'
