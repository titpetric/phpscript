---
extends: existence
message: "'%s' asserts importance. Say what breaks without it."
level: error
ignorecase: true
nonword: true
tokens:
  - '\bload[-\s+]bearing\b'
  - '\bmission[-\s+]critical\b'
  - '\bthe\s+linchpin\b'
  - '\bthe\s+crux\b'
  - '\bthis\s+matters\s+because\b'
  - '\bdo\s+not\s+skip\b'
  - '\bit\s+is\s+worth\s+(?:noting|knowing|saying|mentioning)\b'
  - '\bworth\s+(?:noting|knowing|a\s+mention)\b'
  # "One thing" opens an advisory nobody asked for, and the thing it names is
  # either a finding, which goes in the report, or nothing.
  - '\bone\s+thing\b'
  - '\bheads\s+up\b'
  - '\bthe\s+key\s+(?:insight|takeaway|thing)\b'
  - '\b(?:it\s+is|it''s)\s+important\s+to\b'
  - '\bimportant\s+to\s+(?:note|remember|understand)\b'
  - '\bplays\s+a\s+(?:key|crucial|vital|central|major)\s+role\b'
  - '\bthe\s+important\s+(?:thing|part)\s+(?:is|here)\b'
  - '\bcannot\s+be\s+overstated\b'
  - '\bis\s+not\s+optional\b'
  - '\bis\s+non-negotiable\b'
  # A test is described by what it detects: "fails when the reset stops
  # clearing the buffer stack", not by a figure of speech about its strength.
  - '\bhas\s+(?:real\s+)?teeth\b'
  - '\bwith\s+teeth\b'
  - '\btoothless\b'
