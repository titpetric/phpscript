---
extends: substitution
message: "AI register. Write '%s' instead of '%s'."
level: error
ignorecase: true
swap:
  delve: read
  delves: reads
  seamless: direct
  seamlessly: directly
  robust: correct
  leverage: use
  leverages: uses
  leveraging: using
  utilize: use
  utilizes: uses
  utilization: use
  crucial: required
  vital: required
  comprehensive: complete
  unlock: enable
  unlocks: enables
  empower: let
  empowers: lets
  elevate: raise
  elevates: raises
  streamline: simplify
  streamlines: simplifies
  effortless: automatic
  plethora: many
  myriad: many
  ecosystem: the named tools
  landscape: the named tools
  tapestry: the named parts
  synergy: the shared behaviour
  holistic: whole-system
  paradigm: model
  game-changing: name the change
  cutting-edge: current
  outlier: name the difference
  'state-of-the-art': current
  'best-in-class': name the comparison
  'deep\s+dive': detail
  'dive\s+into': read
  'under\s+the\s+hood': in the implementation
  'at\s+its\s+core': name the component
  'the\s+beauty\s+of': cut this
  # The brochure vocabulary. Each one praises a thing instead of saying what
  # it does, and the swap is the question it leaves unanswered. None appears
  # in the standard library corpus.
  powerful: name the capability
  versatile: name the uses
  effortlessly: automatically
  unleash: enable
  unleashes: enables
  'full\s+potential': name the limit
  'rich\s+set\s+of': the named parts
  'wealth\s+of': the count
  'cater\s+to': serve
  'caters\s+to': serves
  'tailored\s+to': written for
  'best\s+practice': name the rule
  'the\s+world\s+of': cut this
  'shed\s+light\s+on': measure
  'gain\s+insight': measure
  'pave\s+the\s+way': name what comes next
  'a\s+testament\s+to': name the evidence
