---
extends: existence
message: "'%s' dates the sentence. State the current behaviour; history belongs in a commit message."
level: error
ignorecase: true
nonword: true
tokens:
  - '\bpreviously\b'
  # The past-habitual only. "cannot be used to find out" is passive voice.
  - '\b(?:it|this|that|they|we|which|there|section|document|field|key)\s+used\s+to\b'
  - '\bused\s+to\s+(?:say|be|have|do|work|live|read|carry|return|call|report|mean)\b'
  - '\bno\s+longer\b'
  - '\ban\s+earlier\s+(?:revision|version)\b'
  - '\bhistorically\b'
  - '\bin\s+the\s+past\b'
  - '\buntil\s+recently\b'
  - '\bas\s+of\s+(?:now|today|this\s+writing)\b'
  - '\bcurrently\b'
  - '\bat\s+present\b'
  - '\bfor\s+now\b'
  - '\bgoing\s+forward\b'
