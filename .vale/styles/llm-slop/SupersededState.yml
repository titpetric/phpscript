---
extends: existence
message: "'%s' dates the sentence. State the current behaviour; history belongs in a commit message."
level: warning
ignorecase: true
nonword: true
tokens:
  - '\bpreviously\b'
  - '\bused to\b'
  - '\bno longer\b'
  - '\ban earlier (?:revision|version)\b'
  - '\bhistorically\b'
  - '\bin the past\b'
  - '\buntil recently\b'
  - '\bas of (?:now|today|this writing)\b'
  - '\bcurrently\b'
  - '\bat present\b'
  - '\bfor now\b'
  - '\bgoing forward\b'
