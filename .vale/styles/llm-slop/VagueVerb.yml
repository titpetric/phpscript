---
extends: existence
message: "'%s' is vague. A function returns, writes, reports, reads, sets or refuses; a field holds, names or sends a value; an implementation implements, runs or acts on state."
level: error
ignorecase: true
nonword: true
tokens:
  - '\bgives?(?:\s+back)?\b'
  - '\bgiving\b'
  # The verb only. "left-hand end" and "first-hand" are not it.
  - '\bhands?\s+(?:back|off|over|it|them|the|a|an|its)\b'
  - '\byields?\b'
  - '\bprovides?\b'
  - '\boffers?\b'
  - '\bgrabs?\b'
  - '\bspits?\s+out\b'
  - '\bcomes?\s+back\s+with\b'
  - '\bends?\s+up\b'
  - '\bwinds?\s+up\b'
  - '\bmakes?\s+sure\b'
  - '\btakes?\s+care\s+of\b'
  - '\bdeals?\s+with\b'
  - '\bgoes?\s+through\b'
  - '\bsorts?\s+out\b'
  - '\bfigures?\s+out\b'
  # One verb standing in for every relation a thing can have to a value:
  # holds, stores, sends, sets, lists, names. A request carries a header, a
  # struct carries a field, a commit carries a change, and none of them says
  # what the relation is.
  #
  # A hyphen in front rules out the compound adjective: "load-carrying" is
  # one word and names no relation. RE2 has no lookbehind, so the character
  # before the verb is matched and shows up in the report. A carriage
  # return never matches, since "carriage" is not one of the endings.
  - '(?:^|[^-\w])carr(?:y|ies|ied|ying)\b'
