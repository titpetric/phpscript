---
extends: existence
message: "Dramatic countdown: '%s'. State the fact once."
level: error
ignorecase: true
nonword: true
tokens:
  - '\bNot\s+a\s+\w+\.\s+Not\s+a\s+\w+\.'
  - '\bNot\s+\w+\.\s+Not\s+\w+\.\s+'
  - '\bone\s+(?:word|thing|reason):\s*$'
  - '\bthe\s+(?:real|actual)\s+(?:problem|issue|answer)\s+(?:is|was)\b'
