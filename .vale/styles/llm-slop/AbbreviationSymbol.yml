# The abbreviations that are also identifiers in this repository: the config
# package, config/config.yml, $config, config(), the info command, the /info
# route, impl, perf, repo.
#
# A backtick before the word exempts it, so citing a symbol works in markdown,
# in a Go doc comment and in a PHP comment alike. vale's TokenIgnores only
# reaches markup formats, and a source file arrives as comments extracted to
# plain text, so the guard lives in the pattern: `[^\x60]` consumes one
# character and refuses to match where that character is a backtick. vale's
# engine has no lookbehind, which is why the guard is part of the match and the
# reported text carries the character before the word.
#
# Abbreviation.yml holds the rest, the ones no identifier collides with.
extends: existence
message: "Write %s out, or cite the symbol in backticks."
level: error
ignorecase: false
raw:
  - '[^`]\b(config|configs|info|impl|perf|repo|repos)\b'
