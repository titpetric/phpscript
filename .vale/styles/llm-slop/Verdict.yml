---
extends: existence
message: "'%s' is a verdict on the fact before it. Delete it or name both sides."
level: error
ignorecase: true
nonword: true
tokens:
  - '\bthat\s+is\s+the\s+(?:cost|price|trade|tradeoff|trade-off)\s+of\b'
  - '\ba\s+small\s+price\s+to\s+pay\b'
  - '\bworth\s+it\b'
  # The appended form only. "OK (by design)" is a defined status in
  # docs/allocation-performance.md, and every row using it states the reason.
  - ',\s*by\s+design\b'
  - '\b(?:is|are|was|were)\s+by\s+design\b'
  - '\bwhich\s+is\s+by\s+design\b'
  - '\bthis\s+is\s+the\s+(?:tradeoff|trade-off|compromise)\b'
  - '\bdeliberate(?:ly)?\b'
  - '\bon\s+purpose\b'
  - '\bthe\s+only\s+(?:genuine|real|honest|true)\s+(?:answer|way|option)\b'
  - '\bthe\s+one\s+that\s+matters\b'
  - '\bthe\s+(?:part|thing|figure|row|column)\s+(?:that|which)\s+matters\b'
  - '\bwhat\s+really\s+matters\b'
  - '\bthe\s+wrong\s+(?:thing|move|call)\b'
  - '\bis\s+the\s+whole\s+(?:problem|story|of\s+it)\b'
