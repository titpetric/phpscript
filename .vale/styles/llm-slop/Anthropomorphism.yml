---
extends: existence
message: "Code does not ask, want, know or decide to: '%s'. State the contract."
level: error
ignorecase: true
nonword: true
tokens:
  # An API contract is a contract. Nothing in it asks for anything.
  - '\basks?\s+(?:for|a|the|whether|what|how)\b'
  - '\basking\s+(?:for|a|the|whether)\b'
  - '\basked\s+for\b'
  - '\bwhat\s+(?:it|the\s+\w+)\s+asks\b'
  - '\bwants?\s+(?:to|a|an|the)\b'
  - '\bknows?\s+(?:to|that|which|what)\b'
  - '\bbelieves?\b'
  - '\bexpects?\s+(?:to|that)\b'
  - '\bis\s+happy\s+to\b'
  - '\bprefers?\s+to\b'
  - '\bchooses?\s+to\b'
  - '\brefuses?\s+to\b'
  - '\btries?\s+to\b'
  - '\bhas\s+an\s+opinion\s+about\b'
  - '\bcares?\s+about\b'
