include:
  - docker/service/mysql.yml
  - docker/service/postgres.yml

# The demo applications; docs/pipeline.md argues the commands and the networks.
services:
  phpscript:
    image: titpetric/phpscript:latest
    env_file: .env.docker
    command: ["--cover", "--coverfile", "cover/dbadmin.{time}.cov", "server"]
    networks:
      - projects-ingress
      - default
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    labels:
      caddy: dbadmin.localhost
      caddy.reverse_proxy: "{{upstreams 8080}}"
    volumes:
      - $PWD/demos/dbadmin/:/app
      - $PWD/cover:/app/cover

  example:
    image: titpetric/phpscript:latest
    command: ["-f", "config.yml", "server", "."]
    networks:
      - projects-ingress
    labels:
      caddy: example.localhost
      caddy.reverse_proxy: "{{upstreams 8080}}"
    volumes:
      - $PWD/demos/example/:/app

networks:
  projects-ingress:
    external: true
