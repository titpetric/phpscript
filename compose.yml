include:
  - docker/service/mysql.yml
  - docker/service/postgres.yml

services:
  phpscript:
    image: titpetric/phpscript:latest
    env_file: .env.docker
    # Two networks: the ingress one publishes it, and the project default is
    # where mysql and postgres are. dbadmin opens connections to both, and a
    # service that cannot resolve them reports every driver but sqlite as
    # unreachable.
    networks:
      - projects-ingress
      - default
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    labels:
      caddy: dbadmin.localhost
      caddy.reverse_proxy: "{{upstreams 8080}}"
    volumes:
      - $PWD/demos/dbadmin/:/app

  # The tutorial application. It carries its own config.yml, so it is started
  # with -f rather than through .env.docker.
  example:
    image: titpetric/phpscript:latest
    command: ["-f", "config.yml", "server", "."]
    networks:
      - projects-ingress
    labels:
      caddy: example.localhost
      caddy.reverse_proxy: "{{upstreams 8080}}"
    volumes:
      - $PWD/demos/example/:/app

networks:
  projects-ingress:
    external: true
